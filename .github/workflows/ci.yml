name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  smoke:
    name: agent runtime smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start API (mock analyzer, in-memory inventory)
        run: |
          INVENTORY_BACKEND=memory npx tsx server/index.ts &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health && break
            sleep 1
          done
      - name: Smoke the agent runtime end-to-end
        run: BASE_URL=http://localhost:8787 npm run smoke:agent
      - name: Stop API
        if: always()
        run: kill "$API_PID" || true
