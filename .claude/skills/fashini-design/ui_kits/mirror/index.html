<!-- @dsCard group="Mirror" viewport="1080x1460" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fashini — Mirror</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--inset); height: 100%; }
  #stage { width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .mirror {
    width: 1080px; height: 1920px; background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: var(--font-sans); color: var(--ink);
  }
  .m-top { display: flex; align-items: center; justify-content: space-between; padding: 40px 56px 0; }
  .m-brand strong { display: block; font-size: 30px; font-weight: 800; letter-spacing: 0.03em; }
  .m-progress { height: 3px; background: var(--hairline); margin: 32px 56px 0; }
  .m-progress span { display: block; height: 100%; background: var(--accent); transition: width var(--dur-slow) var(--ease-out); }
  .m-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 56px; min-height: 0; }

  h1, h2 { letter-spacing: var(--tracking-heading); margin: 0; }
  h2 { font-size: 56px; font-weight: 700; margin: 12px 0 0; }

  /* welcome */
  .m-welcome h1.kinetic { font-size: 88px; font-weight: 800; letter-spacing: var(--tracking-display); line-height: 1.05; margin: 24px 0; }
  .kinetic .line { display: block; overflow: hidden; }
  .kinetic .line > span { display: block; animation: fashini-line-rise var(--dur-choreo) var(--ease-out) both; }
  .kinetic .line:nth-child(2) > span { animation-delay: .12s; }
  .kinetic .line:nth-child(3) > span { animation-delay: .24s; }
  .m-lede { font-size: 26px; line-height: 1.6; color: var(--muted); max-width: 820px; margin: 0 0 44px; }
  .m-trust { display: flex; gap: 40px; margin-top: 44px; font-size: 20px; color: var(--muted); }
  .m-trust span::before { content: "✓"; color: var(--ok); margin-right: 12px; }

  /* panels */
  .m-panel > h2, .m-capture > h2, .m-analyzing > h2, .m-review > h2, .m-complete > h2 { font-size: 52px; }
  .m-intro { font-size: 24px; line-height: 1.6; color: var(--muted); max-width: 840px; margin: 18px 0 40px; }
  .m-consent-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 36px; }
  .m-consent-cards article { background: var(--inset); border-radius: var(--radius-card); padding: 28px; }
  .m-consent-cards article span { font-family: var(--font-mono); font-size: 15px; color: var(--faint); }
  .m-consent-cards h3 { font-size: 22px; margin: 28px 0 10px; }
  .m-consent-cards p { font-size: 16px; color: var(--muted); line-height: 1.5; margin: 0; }
  .m-panel :is(label) { font-size: 22px; }

  .m-form { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-bottom: 36px; }
  .m-form label { display: block; }
  .fl { display: block; font-size: 20px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .fl2 { font-size: 20px; font-weight: 600; color: var(--muted); margin: 30px 0 14px; }

  .m-actions { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--hairline); margin-top: 48px; padding-top: 36px; }
  .m-actions .fsh-btn { font-size: 22px; }
  .m-actions .fsh-btn--lg { height: 88px; padding: 0 40px; }

  /* capture */
  .cam { position: relative; margin: 40px 0; aspect-ratio: 3/4; background: var(--inset); border: 1px solid var(--hairline); border-radius: var(--radius-card); overflow: hidden; }
  .guide { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 42%; height: 82%; border: 2px dashed var(--faint); border-radius: 44% 44% 24% 24% / 12% 12% 8% 8%; transition: border-color var(--dur-base); }
  .guide.ready { border-color: var(--accent); box-shadow: inset 0 0 60px rgba(27,43,216,.06); }
  .c { position: absolute; width: 34px; height: 34px; border: 3px solid var(--ink); }
  .guide.ready .c { border-color: var(--accent); }
  .c.tl{left:-3px;top:-3px;border-width:3px 0 0 3px}.c.tr{right:-3px;top:-3px;border-width:3px 3px 0 0}.c.bl{left:-3px;bottom:-3px;border-width:0 0 3px 3px}.c.br{right:-3px;bottom:-3px;border-width:0 3px 3px 0}
  .countdown { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-family: var(--font-mono); font-size: 180px; font-weight: 700; color: var(--accent); }
  .cam-status { position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--ink); background: var(--surface); border: 1px solid var(--hairline); padding: 12px 20px; border-radius: var(--radius-pill); }
  .sl { width: 12px; height: 12px; border-radius: 50%; background: var(--faint); }
  .sl.ready { background: var(--accent); }

  /* analyzing / review figures */
  .m-analyzing .fsh-tryon, .m-review .fsh-tryon { aspect-ratio: 3/4; }
  .afig { position: relative; width: 100%; height: 100%; }
  .afig-head { width: 22%; aspect-ratio: .84; border-radius: 50%; background: var(--inset); border: 1px solid var(--hairline); margin: 10% auto 0; }
  .afig-body { width: 44%; height: 46%; margin: 3% auto 0; background: #fff; border: 1px solid var(--hairline); border-radius: 28% 28% 10px 10px / 12% 12% 8px 8px; }
  .m-note, .m-analyzing .m-note { font-size: 20px; color: var(--muted); margin-top: 28px; }

  .review-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; margin: 32px 0; }
  .ootd-side { display: flex; flex-direction: column; gap: 24px; }
  .ootd-facts { display: flex; gap: 40px; }
  .ootd-facts strong { display: block; font-size: 26px; margin-top: 6px; letter-spacing: -0.01em; }
  .ootd-items { display: flex; flex-direction: column; gap: 0; }
  .ootd-item { padding: 18px 0; border-bottom: 1px solid var(--hairline); }
  .ootd-item strong { display: block; font-size: 24px; margin: 6px 0 2px; }
  .ootd-item span { font-size: 18px; color: var(--muted); }
  .privacy-panel { background: var(--inset); border-radius: var(--radius-card); padding: 24px; margin-top: 4px; }
  .privacy-panel p { font-size: 18px; line-height: 1.55; color: var(--muted); margin: 12px 0 16px; }

  /* complete */
  .m-complete { text-align: left; }
  .mark { width: 88px; height: 88px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 44px; margin-bottom: 32px; }
  .m-summary { display: flex; gap: 48px; margin: 40px 0; }
  .m-summary .mono { display: block; font-family: var(--font-mono); font-size: 34px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>
  <script type="text/babel" src="Flow.jsx"></script>
  <script type="text/babel">
    const MirrorFlow = window.MirrorFlow;
    ReactDOM.createRoot(document.getElementById("root")).render(<MirrorFlow />);
    function fit() {
      const el = document.querySelector(".mirror"); if (!el) { requestAnimationFrame(fit); return; }
      const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      el.style.transform = `scale(${s})`; el.style.transformOrigin = "center";
    }
    window.addEventListener("resize", fit); requestAnimationFrame(fit);
  </script>
</body>
</html>
