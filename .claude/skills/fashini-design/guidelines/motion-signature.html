<!-- @dsCard group="Motion" viewport="700x210" name="Signature motion" subtitle="Live: scan-line reveal + staggered rows" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; display: flex; gap: 24px; align-items: center; }
  .stage { position: relative; width: 130px; height: 160px; background: var(--inset); border: 1px solid var(--hairline); border-radius: var(--radius-card); overflow: hidden; }
  .scan { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); box-shadow: 0 0 14px 2px rgba(27,43,216,0.5); animation: fashini-scan-sweep 2.6s var(--ease-out) infinite; }
  .fig { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 54%; height: 74%; background: #fff; border: 1px solid var(--hairline); border-radius: 40% 40% 8px 8px / 22% 22% 8px 8px; }
  .rows { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--hairline); border-radius: var(--radius-control); font-family: var(--font-mono); font-size: 12px; animation: fashini-row-in 0.6s var(--ease-out) both; }
  .r:nth-child(1){animation-delay:.1s}.r:nth-child(2){animation-delay:.22s}.r:nth-child(3){animation-delay:.34s}.r:nth-child(4){animation-delay:.46s}
  .r span:first-child { color: var(--faint); }
  .r b { margin-left: auto; font-weight: 600; }
  .ok{color:var(--ok)}.held{color:var(--held)}
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-top: 6px; }
</style>
</head>
<body>
  <div class="stage"><div class="fig"></div><div class="scan"></div></div>
  <div>
    <div class="rows">
      <div class="r"><span>01</span> match_body_template <b class="ok">ok</b></div>
      <div class="r"><span>02</span> get_recommendations <b class="ok">ok</b></div>
      <div class="r"><span>03</span> check_inventory <b class="held">held</b></div>
      <div class="r"><span>04</span> reserve_items <b class="ok">ok</b></div>
    </div>
    <div class="meta">ease cubic-bezier(.16,1,.3,1) · 0.4–0.9s · stagger 80ms · honors reduced-motion</div>
  </div>
</body>
</html>
