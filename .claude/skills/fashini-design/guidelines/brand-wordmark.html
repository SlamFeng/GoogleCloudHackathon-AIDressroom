<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 28px; }
  .lockup { display: inline-flex; flex-direction: column; gap: 5px; }
  .word { font-size: 40px; font-weight: 800; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; line-height: 1; }
  .sub { font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-label-wide); text-transform: uppercase; color: var(--muted); }
  .note { font-size: 11px; color: var(--faint); margin-top: 18px; }
</style>
</head>
<body>
  <div class="lockup">
    <div class="word">Fashini</div>
    <div class="sub">AI Style Advisor</div>
  </div>
  <div class="note">No logo mark was provided or drawn. Wordmark is set type only.</div>
</body>
</html>
