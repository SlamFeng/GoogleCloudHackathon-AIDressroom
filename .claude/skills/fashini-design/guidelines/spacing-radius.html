<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & shadow" subtitle="Two radii; shadow only on hover-lift" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .box { width: 120px; height: 78px; background: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .b-card { border: 1px solid var(--hairline); border-radius: var(--radius-card); }
  .b-ctrl { border: 1px solid var(--hairline); border-radius: var(--radius-control); }
  .b-lift { border: 1px solid var(--hairline); border-radius: var(--radius-card); box-shadow: var(--shadow-lift); }
  .name { font-size: 12px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="box b-card">12px</div><div class="name">Card radius</div></div>
    <div><div class="box b-ctrl">8px</div><div class="name">Control radius</div></div>
    <div><div class="box b-lift">hover</div><div class="name">Hover-lift shadow</div></div>
  </div>
</body>
</html>
