<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .price { font-size: 46px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .price small { font-size: 22px; font-weight: 600; margin-right: 2px; }
  .data { display: flex; gap: 26px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .data b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="price"><small>¥</small>12,900</div>
  <div class="data">
    <span>SKU <b>OT-2213-NVY</b></span>
    <span>14:32:07</span>
    <span>Round <b>2</b></span>
    <span>set_a1 · set_b2</span>
  </div>
</body>
</html>
